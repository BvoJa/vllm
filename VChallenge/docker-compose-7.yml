services:
  model:
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --tensor-parallel-size=1 #Don't change this to vllm-server
      - --spec-method=draft_model
      - --spec-model=LiquidAI/LFM2.5-350M-Instruct
      - --spec-tokens=5
      - --enable-prefix-caching
      - --kv-cache-dtype=fp8
      - --quantization=fp8
      - --max-model-len=4800             
      - --max-num-batched-tokens=4800    
      - --max-num-seqs=32                # Khôi phục về mức tối ưu của bản 61.32
      - --async-scheduling               
      - --disable-log-stats
      - --no-enable-log-requests
      - --gpu-memory-utilization=0.95

      # --- THAY ĐỔI DUY NHẤT LẦN NÀY ---
      - --block-size=32                  # Giảm 50% số lượng block metadata, giải phóng kịch sàn CPU
      - --enable-chunked-prefill
      - --long-prefill-token-threshold=2500

    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]